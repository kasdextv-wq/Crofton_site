const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s)); const toast=$('#toast'); let state={showcaseIds:[],projects:[],testimonials:[]};
const show=m=>{toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2600)}; const esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action='list',payload=null){const opts={credentials:'same-origin'}; if(payload){opts.method='POST';opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(payload)} const r=await fetch('projects_api.php?action='+encodeURIComponent(action),opts); const d=await r.json().catch(()=>({ok:false,error:'Bad JSON'})); if(!r.ok||!d.ok)throw new Error(d.error||'API error'); return d;}
async function checkAuth(){try{const r=await fetch('auth.php?action=check',{credentials:'same-origin'});const d=await r.json();if(d.ok)unlock();}catch(e){console.warn(e)}} checkAuth();
async function unlock(){$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');await load();}
$('#login').onsubmit=async e=>{e.preventDefault();$('#err').style.display='none';try{const r=await fetch('auth.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pass').value})});const d=await r.json().catch(()=>({ok:false})); if(r.ok&&d.ok)unlock(); else $('#err').style.display='block';}catch(err){$('#err').style.display='block';}};
$('#logout').onclick=async()=>{await fetch('auth.php?action=logout',{credentials:'same-origin'}); location.reload();};
async function load(){try{const d=await api('list'); state={showcaseIds:d.showcaseIds||[],projects:d.projects||[],testimonials:d.testimonials||[]}; render();}catch(e){show('Ошибка загрузки: '+e.message)}}
function sync(){$$('.review-editor').forEach(card=>{const i=+card.dataset.i,t=state.testimonials[i]; if(!t)return; t.text=$('[data-r=text]',card).value.trim();t.author=$('[data-r=author]',card).value.trim();t.position=$('[data-r=position]',card).value.trim();t.workType=$('[data-r=workType]',card).value.trim();});}
async function save(){sync();try{const d=await api('save',state); state={showcaseIds:d.showcaseIds,projects:d.projects,testimonials:d.testimonials||[]}; render(); show('Сохранено на сервере');}catch(e){show('Ошибка сохранения: '+e.message)}}
function render(){$('#reviews').innerHTML=state.testimonials.map((t,i)=>`<article class="review-editor" data-i="${i}"><div class="editor-head"><strong>Отзыв ${i+1}</strong><div class="actions"><button class="secondary" data-a="up" ${i===0?'disabled':''}>↑</button><button class="secondary" data-a="down" ${i===state.testimonials.length-1?'disabled':''}>↓</button><button class="danger" data-a="del">Удалить</button></div></div><div class="grid"><div><div class="avatar-box">${t.avatar?`<img src="${esc(t.avatar)}" alt="">`:''}${t.avatar?'<button class="avatar-remove" data-avatar-del>×</button>':''}</div><input type="file" accept="image/*" data-avatar style="margin-top:10px"></div><label class="full">Текст<textarea rows="4" data-r="text">${esc(t.text)}</textarea></label><label>Автор<input data-r="author" value="${esc(t.author)}"></label><label>Должность<input data-r="position" value="${esc(t.position)}"></label><label>Тип работы<input data-r="workType" value="${esc(t.workType||'')}" placeholder="Веб-сайт / Логотип / Айдентика"></label></div></article>`).join('');}
$('#save').onclick=save; $('#addReview').onclick=()=>{sync();state.testimonials.push({text:'Текст отзыва',author:'Имя клиента',position:'Должность',workType:'Веб-сайт',avatar:''});render();};
$('#reviews').onclick=async e=>{const delAv=e.target.closest('[data-avatar-del]'); if(delAv){const i=+delAv.closest('.review-editor').dataset.i; if(confirm('Удалить аватарку?')){sync();state.testimonials[i].avatar='';await save();} return;} const b=e.target.closest('button[data-a]'); if(!b)return; sync(); const i=+b.closest('.review-editor').dataset.i,a=b.dataset.a; if(a==='up'&&i>0)[state.testimonials[i-1],state.testimonials[i]]=[state.testimonials[i],state.testimonials[i-1]]; if(a==='down'&&i<state.testimonials.length-1)[state.testimonials[i+1],state.testimonials[i]]=[state.testimonials[i],state.testimonials[i+1]]; if(a==='del'&&confirm('Удалить отзыв?'))state.testimonials.splice(i,1); render();};
$('#reviews').onchange=async e=>{const inp=e.target.closest('[data-avatar]'); if(!inp||!inp.files.length)return; const i=+inp.closest('.review-editor').dataset.i; sync(); const fd=new FormData(); fd.append('images[]',inp.files[0]); try{const r=await fetch('projects_api.php?action=upload',{method:'POST',credentials:'same-origin',body:fd}); const d=await r.json(); if(!r.ok||!d.ok) throw new Error(d.error||'upload failed'); state.testimonials[i].avatar=(d.urls||[])[0]||''; await save(); show('Аватарка загружена');}catch(err){show('Ошибка загрузки: '+err.message)} };
</script></body></html>
